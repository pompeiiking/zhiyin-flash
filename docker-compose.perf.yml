x-zhiyin-environment: &zhiyin-environment
  ZHIYIN_ENV: docker
  ZHIYIN_USE_REDIS: "1"
  ZHIYIN_REDIS_URL: redis://redis:6379/0
  ZHIYIN_REDIS_KEY_PREFIX: zhiyin
  ZHIYIN_USE_POSTGRES: "1"
  ZHIYIN_POSTGRES_DSN: postgresql://zhiyin:zhiyin@postgres:5432/zhiyin
  ZHIYIN_AUTH_JWT_SECRET: ${ZHIYIN_AUTH_JWT_SECRET:?ZHIYIN_AUTH_JWT_SECRET is required}
  ZHIYIN_AUTH_TOKEN_TTL_S: "86400"

x-zhiyin-image: &zhiyin-image
  image: zhiyin-flash:${ZHIYIN_IMAGE_TAG:-baseline-20260930}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  volumes:
    - zhiyin-object-data:/app/data/objects
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - zhiyin-flash-net

services:
  # 无状态 API 副本：不绑定 container_name，不占用宿主机 8000 端口。
  # 正式候选方案由成员 C 使用 --scale zhiyin-flash=2 启动。
  zhiyin-flash:
    <<: *zhiyin-image
    command:
      [
        "python",
        "-m",
        "zhiyin_boot",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${ZHIYIN_WEB_WORKERS:-1}",
      ]
    environment:
      <<: *zhiyin-environment
      ZHIYIN_RUN_IN_PROCESS_BACKGROUND: "0"
      ZHIYIN_POSTGRES_POOL_MIN_SIZE: "1"
      ZHIYIN_POSTGRES_POOL_MAX_SIZE: ${ZHIYIN_API_POOL_MAX_SIZE:-5}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # 调度器和业务 Worker 只在这一个服务中运行。不对 Nginx 暴露端口，
  # 也不对该服务使用 --scale。
  zhiyin-background:
    <<: *zhiyin-image
    command: ["python", "-m", "zhiyin_boot", "background"]
    environment:
      <<: *zhiyin-environment
      ZHIYIN_RUN_IN_PROCESS_BACKGROUND: "0"
      ZHIYIN_POSTGRES_POOL_MIN_SIZE: "1"
      ZHIYIN_POSTGRES_POOL_MAX_SIZE: ${ZHIYIN_BACKGROUND_POOL_MAX_SIZE:-2}

  web:
    # 成员 B 修改了 Nginx 配置，正式压测必须使用与后端候选版本
    # 一起登记的不可变 web 镜像，不能悄悄沿用旧 latest。
    image: zhiyin-flash-web:${ZHIYIN_WEB_IMAGE_TAG:-latest}
    container_name: zhiyin-flash-web
    build:
      context: ./zhiyin-src/template/zhiyin-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      zhiyin-flash:
        condition: service_healthy
    networks:
      - zhiyin-flash-net

  redis:
    image: redis:7-alpine
    container_name: zhiyin-flash-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - zhiyin-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - zhiyin-flash-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhiyin-flash-postgres
    environment:
      POSTGRES_USER: zhiyin
      POSTGRES_PASSWORD: zhiyin
      POSTGRES_DB: zhiyin
    restart: unless-stopped
    volumes:
      - zhiyin-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyin -d zhiyin"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - zhiyin-flash-net

volumes:
  zhiyin-redis-data:
  zhiyin-postgres-data:
  zhiyin-object-data:

networks:
  zhiyin-flash-net:
