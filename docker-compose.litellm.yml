services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.98.0
    entrypoint: ["/bin/sh", "/app/validate-and-start.sh"]
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--num_workers",
        "1",
      ]
    env_file:
      - path: ./deploy/litellm/.env.keys
        required: true
    environment:
      LITELLM_MASTER_KEY: ${ZHIYIN_LLM_API_KEY:?ZHIYIN_LLM_API_KEY must contain the internal LiteLLM key}
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
      - ./deploy/litellm/validate-and-start.sh:/app/validate-and-start.sh:ro
      - ./deploy/litellm/verify_load_balancing.py:/app/verify_load_balancing.py:ro
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zhiyin-flash-net

  zhiyin-flash:
    depends_on:
      litellm:
        condition: service_healthy

  zhiyin-background:
    depends_on:
      litellm:
        condition: service_healthy
