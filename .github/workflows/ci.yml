name: CI

permissions:
  contents: read

# 架构约束不靠 review 记忆：越层 / 漏装配 / 契约漂移 / 断链在提交时就该失败。
# 本地同样的三条命令见 README「五分钟上手」。
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（守卫 + 契约 + 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zhiyin-src/template
    env:
      # 门禁要看到"真模型客户端装配得上"。CI 里没有密钥，`gateways.llm` 会是 not_wired，
      # 于是 `--check --phase=1` 必红 —— 而它红的原因（"没人给 CI 一把钥匙"）与
      # 它想守的东西（"框架装配得起来"）无关。这里给一把**占位**密钥：只验证装配，
      # 不发任何请求；真实密钥永远不进 CI。
      ZHIYIN_USE_REMOTE_LLM: "1"
      ZHIYIN_LLM_API_KEY: "ci-placeholder-not-a-real-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 测试（AST 依赖守卫 + Port 契约测试 + 单元测试）
        run: python -m pytest -q
      - name: 静态检查
        run: python -m ruff check .
      - name: 模块接入声明检查
        run: python scripts/module_cli.py check
      - name: 接口契约快照与代码一致（contracts/openapi.json）
        run: python scripts/export_openapi.py --check
      - name: 里程碑门禁 M1（框架可验证，本期退出条件）
        run: python -m zhiyin_boot --check --phase=1

  frontend:
    name: 前端（类型检查）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zhiyin-src/template/zhiyin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zhiyin-src/template/zhiyin-web/package-lock.json
      - name: 安装依赖
        # package-lock.json 已入库，用 npm ci 保证 CI 装到的版本与本地一致。
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck
      - name: 构建（产物能不能出来，构建期才能发现的问题）
        run: npm run build
      - name: 前端类型与后端接口契约一致（types.ts == 契约快照的生成物）
        # 由 ../contracts/openapi.json 重新生成 src/api/types.ts 并比对：有 diff 说明
        # 后端改了字段而前端类型没跟上，或有人手改了生成物。
        # 快照本身与后端代码的一致性由后端作业的 pytest 守卫（tests/test_api_contract.py）。
        # 注意：本步断言的是"仓库里已提交的生成物与快照一致"，因此在本地未提交时会必然红，
        # 它的执行场合是 CI（干净工作区）。
        run: npm run check:api

  module-dataflow:
    name: 模块数据流（真实 PostgreSQL / Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zhiyin
          POSTGRES_PASSWORD: ci-isolated-database
          POSTGRES_DB: zhiyin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zhiyin -d zhiyin"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: zhiyin-src/template
    env:
      ZHIYIN_USE_POSTGRES: "1"
      ZHIYIN_POSTGRES_DSN: postgresql://zhiyin:ci-isolated-database@127.0.0.1:5432/zhiyin
      ZHIYIN_USE_REDIS: "1"
      ZHIYIN_REDIS_URL: redis://127.0.0.1:56379/0
      ZHIYIN_MODULE_ENV: integration
      ZHIYIN_DATAFLOW_ISOLATED: "1"
      ZHIYIN_RUN_BACKGROUND_WORKERS: "0"
      ZHIYIN_AUTH_JWT_SECRET: ci-isolated-auth-secret-not-for-production
      # 平台装配走的是"有真模型"那条路：没有它，按 `container/services.py` 里
      # 「宁可明确地没有 AI」的设计，智能体引擎与编排器**不装配** → facade 建不出来
      # → 模块平台不注册 → 这个 job 从建起来那天就跑不起来（一直是红的）。
      # 这里给的是**占位密钥**：本 job 只跑模块数据流，一次模型调用都没有。
      ZHIYIN_USE_REMOTE_LLM: "1"
      ZHIYIN_LLM_API_KEY: ci-assembly-only-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 平台强制数据链路与业务操作回读
        run: python scripts/module_dataflow_acceptance.py --output module-dataflow-report.json
      - name: 保存数据流证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-dataflow-report
          path: zhiyin-src/template/module-dataflow-report.json
          if-no-files-found: warn
