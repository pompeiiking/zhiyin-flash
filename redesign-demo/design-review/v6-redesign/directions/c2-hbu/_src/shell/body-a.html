
</style>
</head>
<body>

<!-- 品牌身份条：河大官网顶部那条红（layout.css 的 .top），3px，不随 accent 变 -->
<div class="brandstripe" aria-hidden="true"></div>

<!-- 视图登记表（由 _tools/build.mjs 从 _src/views.json 注入）：目录面板与文档标题读它 -->
<!--VIEW-REGISTRY-->

<div class="app" data-nav="full" data-drawer="closed" id="app">

  <!-- ======================= 左侧导航（可折叠） =======================
       多视图版：每项带 data-nav-to="<视图 key>"，由 _src/app.js 的路由负责高亮。
       高亮不写在标记里，因为"哪一项是当前页"是路由状态，不是文档内容。 -->
  <nav class="nav" id="sidenav" aria-label="主导航">
    <div class="nav__brand">
      <span class="nav__mark" aria-hidden="true">职</span>
      <span class="nav__names">
        <span class="nav__name">职引</span>
        <span class="nav__sub">陪你走完这一段</span>
      </span>
      <button class="nav__toggle" id="navToggle" type="button" aria-expanded="true" aria-controls="sidenav" title="折叠导航">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        <span class="sr">折叠导航</span>
      </button>
    </div>

    <div class="nav__group">
      <p class="nav__label">对话</p>
      <a class="nav__item" href="#/chat" data-nav-to="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.9-.4L4 21l1.6-4a8.2 8.2 0 0 1-.6-3.1 8.4 8.4 0 0 1 8-8.4 8.4 8.4 0 0 1 8 6Z"/></svg>
        <span class="nav__names">咨询对话</span><span class="nav__badge">1</span>
      </a>
    </div>

    <div class="nav__group">
      <p class="nav__label">了解自己</p>
      <a class="nav__item" href="#/profile" data-nav-to="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span class="nav__names">个人画像</span>
      </a>
      <a class="nav__item" href="#/academic" data-nav-to="academic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 8l9 4 9-4z"/><path d="M6 10.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5"/></svg>
        <span class="nav__names">学籍与资料</span>
      </a>
      <a class="nav__item" href="#/report" data-nav-to="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span class="nav__names">诊断报告</span>
      </a>
    </div>

    <div class="nav__group">
      <p class="nav__label">做决定</p>
      <a class="nav__item" href="#/directions" data-nav-to="directions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 9 8l4 6 3-4 4 8z"/></svg>
        <span class="nav__names">方向方案</span>
      </a>
      <a class="nav__item" href="#/intel" data-nav-to="intel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 2.4 14.6 0 17"/></svg>
        <span class="nav__names">岗位资讯</span>
      </a>
    </div>

    <div class="nav__group">
      <p class="nav__label">去做</p>
      <a class="nav__item" href="#/home" data-nav-to="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
        <span class="nav__names">今日行动</span><span class="nav__badge">3</span>
      </a>
      <a class="nav__item" href="#/plan" data-nav-to="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v10"/></svg>
        <span class="nav__names">阶段计划</span>
      </a>
      <a class="nav__item" href="#/schedule" data-nav-to="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/></svg>
        <span class="nav__names">日历课表</span>
      </a>
      <a class="nav__item" href="#/notes" data-nav-to="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="m8.5 12 2.4 2.4 4.6-5"/></svg>
        <span class="nav__names">待办与目标</span>
      </a>
    </div>

    <div class="nav__group">
      <p class="nav__label">回头看</p>
      <a class="nav__item" href="#/review" data-nav-to="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3.2 2"/><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 5v4h4"/></svg>
        <span class="nav__names">复盘记录</span>
      </a>
      <a class="nav__item" href="#/achievements" data-nav-to="achievements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 14.4 9.7l5.6.7-4.2 3.8 1.2 5.6L12 17l-5 2.8 1.2-5.6L4 10.4l5.6-.7z"/></svg>
        <span class="nav__names">成长记录</span>
      </a>
    </div>

    <div class="nav__foot">
      <a class="nav__me" href="#/settings" data-nav-to="settings">
        <span class="nav__me-av" aria-hidden="true">陈</span>
        <span class="nav__me-text">
          <span class="nav__me-t">陈亦然</span>
          <span class="nav__me-s">材料科学与工程 · 大三</span>
        </span>
      </a>
    </div>
  </nav>

  <!-- ======================= 顶部细工具条 ======================= -->
  <header class="topbar">
    <div class="topbar__row">
    <button class="topbar__burger" id="burger" type="button" aria-expanded="false" aria-controls="sidenav">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="sr">打开导航</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <label class="sr" for="q">搜索对话、画像与资讯</label>
      <input id="q" type="search" placeholder="搜索对话、画像与资讯">
      <kbd>⌘K</kbd>
    </div>

    <span class="topbar__spacer"></span>

    <div class="topbar__acts">
      <a class="iconbtn" href="#/reminders" data-nav-to="reminders" title="提醒">
        <span class="iconbtn__dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15V10a6 6 0 1 0-12 0v5l-1.5 2.5h15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="sr">提醒（有 1 条未读）</span>
      </a>
      <a class="topbar__me" href="#/settings" data-nav-to="settings">
        <span class="topbar__me-av" aria-hidden="true">陈</span>
        <span>陈亦然</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <span class="sr">账号菜单</span>
      </a>
    </div>
    </div><!-- /topbar__row -->

    <!-- 原型演示台：三轴切换（主色 / 主题 / 密度），常驻在工具条第二行 -->
    <div class="topbar__demo" role="group" aria-label="原型演示：配色与密度切换">
      <span class="demo__tag">原型</span>
      <button class="segb segb--idx" id="viewIndexBtn" type="button" aria-expanded="false" aria-controls="viewIndex" title="这份样张覆盖的全部界面">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>
        全部界面
      </button>
      <div class="demo__grp" role="group" aria-label="主色">
        <span class="demo__lb">主色</span>
        <button class="segb" type="button" data-set="accent" data-val="blue" aria-pressed="true">校徽蓝</button>
        <button class="segb" type="button" data-set="accent" data-val="red" aria-pressed="false">官网红</button>
      </div>
      <div class="demo__grp" role="group" aria-label="主题">
        <span class="demo__lb">主题</span>
        <button class="segb" type="button" data-set="theme" data-val="light" aria-pressed="true">浅色</button>
        <button class="segb" type="button" data-set="theme" data-val="dark" aria-pressed="false">深色</button>
        <button class="segb" type="button" data-set="theme" data-val="auto" aria-pressed="false">跟随系统</button>
      </div>
      <div class="demo__grp" role="group" aria-label="密度">
        <span class="demo__lb">密度</span>
        <button class="segb" type="button" data-set="style" data-val="normal" aria-pressed="true">常规</button>
        <button class="segb" type="button" data-set="style" data-val="dense" aria-pressed="false">紧凑</button>
      </div>
      <span class="demo__note" id="demoNote" aria-live="polite">校徽蓝 #0058A7 · 浅色 · 常规</span>
    </div>
  </header>

  <!-- ======================= 主区 ======================= -->
  <main class="main" id="main">
