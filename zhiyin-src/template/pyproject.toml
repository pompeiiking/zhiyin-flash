[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyin"
version = "1.0.1"
description = "职引 · 第一期工程（模块化单体：api / business / orchestration / data-sdk / infrastructure / boot）"
# 不再声明 readme：原来指向的 `README.md`（本目录下那份工程说明）已按文档收敛删掉，
# 留着就是一个指向不存在文件的引用（setuptools 会静默容忍，但这是"元数据在说谎"）。
# 再要长描述时，请把文件放回本目录并同步这一行。
requires-python = ">=3.11"
license = { text = "Proprietary" }

# 运行依赖：只保留自有基础设施真正用到的部分。
dependencies = [
    "fastapi>=0.110",
    # FastAPI 解析 multipart 表单（`UploadFile` / `Form`）要用它，而它**不在** fastapi
    # 的必装依赖里：不声明的话，本机（碰巧装了）跑得通，镜像里一调上传接口就 500。
    # 课表/成绩的"上传文件"入口就落在这一条上（见 api/controllers/workspace_controller.py）。
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "redis>=5.0",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "PyJWT>=2.8",
    "httpx>=0.27",
    # 真加密（AES-GCM）：`CryptoSecurity` 用它。此前安全网关是 no-op，
    # 密文其实就是明文；换成真实现就必须有这一条。
    "cryptography>=42.0",
    "agno>=2.0",
    # agno 把「模型后端」做成可选安装（extra），`agno.models.openai` 自己不会
    # 把 openai 带上。我们走的就是 OpenAI 兼容那一个后端
    # （见 zhiyin_infrastructure/ai/agno_runtime.py），所以这个分布必须由本包声明。
    #
    # 漏掉它的症状只在**部署镜像**里出现：容器 `import agno.models.openai` 直接
    # ImportError → 起来就崩、一直 Restarting。本机与 CI 看不见，因为那种环境里
    # 的 openai 是别的项目（document-agent / langchain-openai）顺手装进来的。
    # tests/test_declared_dependencies.py 守着这一条。
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
zhiyin = "zhiyin_boot.__main__:main"

# ---------------------------------------------------------------------------
# 六个代码包分布在六个目录下（目录名用连字符、包名用下划线），
# 这里显式列出，保证 `pip install -e .` 后六层都可 import。
# 新增子包时记得同步这里的 packages 列表。
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = [
    "zhiyin_kernel",
    "zhiyin_api",
    "zhiyin_api.controllers",
    "zhiyin_api.dto",
    "zhiyin_api.facade",
    "zhiyin_business",
    "zhiyin_business.contracts",
    "zhiyin_business.ports",
    "zhiyin_business.policies",
    "zhiyin_business.services",
    "zhiyin_business.workers",
    "zhiyin_orchestration",
    "zhiyin_orchestration.impl",
    "zhiyin_data_sdk",
    "zhiyin_data_sdk.gateways",
    "zhiyin_data_sdk.repositories",
    "zhiyin_infrastructure",
    "zhiyin_infrastructure.academic",
    "zhiyin_infrastructure.auth",
    "zhiyin_infrastructure.ai",
    "zhiyin_infrastructure.chsi",
    "zhiyin_infrastructure.local",
    "zhiyin_infrastructure.postgres",
    "zhiyin_infrastructure.postgres.schema",
    "zhiyin_infrastructure.rag",
    "zhiyin_infrastructure.redis",
    "zhiyin_infrastructure.search",
    "zhiyin_infrastructure.security",
    "zhiyin_infrastructure.workers",
    "zhiyin_infrastructure.xuezhi",
    "zhiyin_boot",
    "zhiyin_boot.container",
]

[tool.setuptools.package-dir]
zhiyin_kernel = "zhiyin-kernel/zhiyin_kernel"
zhiyin_api = "zhiyin-api/zhiyin_api"
zhiyin_business = "zhiyin-business/zhiyin_business"
zhiyin_orchestration = "zhiyin-orchestration/zhiyin_orchestration"
zhiyin_data_sdk = "zhiyin-data-sdk/zhiyin_data_sdk"
zhiyin_infrastructure = "zhiyin-infrastructure/zhiyin_infrastructure"
zhiyin_boot = "zhiyin-boot/zhiyin_boot"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 里程碑标记：e2e = 五环节主路径（tests/e2e/），M2 门禁的自动落点。
markers = [
    "e2e: 五环节端到端主路径（tests/e2e/，M2 退出条件）",
]
# 让 pytest 不装包也能直接跑（pytest>=7 的 pythonpath 选项）。
pythonpath = [
    "zhiyin-kernel",
    "zhiyin-api",
    "zhiyin-business",
    "zhiyin-orchestration",
    "zhiyin-data-sdk",
    "zhiyin-infrastructure",
    "zhiyin-boot",
]

[tool.ruff]
line-length = 100
# 与 `requires-python` / CI（3.11）/ 镜像（python:3.11-slim）对齐：
# 测试里用到 `tomllib`（3.11+），代码只按 3.11 跑过，就别声称支持 3.10。
target-version = "py311"

[tool.ruff.lint]
# 只开启「真问题」类别：E/W 语法与错误、F 未使用/未定义、B 常见缺陷。
# 刻意不开 I（isort 顺序）与 UP（pyupgrade）：`.contracts/` 下的契约文件先于
# 本次工程化底座冻结，开启后会产生 30+ 文件的大量纯风格改动。团队要统一风格时，
# 一次性执行 `ruff check --fix` 再把 I、UP 加进来即可。
select = ["E", "F", "B"]
ignore = [
    "E501", # 行长由 formatter 处理，中文注释超长不视为错误
    "B008", # FastAPI 的 Depends()/Body() 默认值调用是框架惯用法
]

[tool.ruff.lint.per-file-ignores]
# 测试里用 assert 与长字符串是正常的
"tests/*" = ["B011"]
