# 职引 · 前端站点（容器内 nginx）
#
# 两条规则：SPA 回退，以及把 /api 原样转给应用容器。
# 前端产物里的接口基地址是**相对路径** `/api/v1`（见 src/api/client.ts 与
# src/ai/registry.ts 的 AI_ENDPOINTS），所以部署形态下不需要把后端地址编译进
# 产物，也没有跨域问题。

log_format zhiyin_upstream
    '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
    'request_time=$request_time upstream_addr=$upstream_addr '
    'upstream_status=$upstream_status upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    # 应用容器的地址在**请求时**才解析，不在启动时。
    # 直接写 `proxy_pass http://zhiyin-flash:8000;` 的话，nginx 会在加载配置那一刻
    # 就去解析这个名字；此时应用容器若还没起来（或刚崩过），nginx 会直接以
    # `host not found in upstream` 退出 —— 前端站点跟着一起下不来，
    # 而真正的问题在后端。用变量 + Docker 内置 DNS 把解析推迟到请求时。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $zhiyin_api http://zhiyin-flash:8000;

    # Docker 日志中保留实际上游容器地址和分段耗时，供压测后证明
    # 请求确实落到多个副本，也能区分“Nginx 等待”与“应用处理”。
    access_log /var/log/nginx/access.log zhiyin_upstream;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带内容哈希，可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：磁盘上没有的路径一律交回 index.html，由 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 服务名取自 docker-compose.yml 里的应用服务名；不带路径部分，
        # 所以 /api/v1/xxx 原样转过去。
        proxy_pass $zhiyin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 只在连接或上游网关错误时尝试另一副本。Nginx 默认不会重试
        # 已发送的非幂等 POST；这里也不启用 non_idempotent，避免重复写业务数据。
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # AI 任务（brief / 维度解读 / 报告小结 / 方向匹配）走 SSE，
        # 前端用 fetch + ReadableStream 读事件流。
        # 只要开了代理缓冲，字节就会攒在 nginx 里不下发 —— 症状是"进度一直不动，
        # 直到整段生成完才一次性弹出来"。所以这里必须关掉缓冲并把读超时放宽。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
